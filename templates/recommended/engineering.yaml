# Software Engineering department — the MVP vertical (architecture.md §9.10).
key: engineering
version: 1
name: Software Engineering
purpose: >
  Design, build, test, and integrate software against CEO requirements. Contracts are written
  first, implementation happens on isolated run branches, and nothing reaches the main branch
  without deterministic test evidence, an independent review, and the configured human acceptance.
default_mode: M4
risk_floor: R1
head: engineering_lead

roles:
  - key: engineering_lead
    version: 1
    title: Engineering Lead
    category: manager
    charter: >
      Turn CEO objectives into an approved engineering plan: interface contracts first, then
      well-scoped tasks with verifiable acceptance criteria, owners, and dependencies. Own integration.
    responsibilities:
      - Clarify ambiguous requirements with the CEO before planning
      - Write interface contracts that subtasks implement against
      - Decompose work into tasks with deterministic acceptance criteria
      - Monitor the team board and resolve blockers within authority
      - Own the integration task and request CEO acceptance for merges to main
    capabilities_required: { structured_output: true, tool_calling: true, min_context_tokens: 128000 }
    tools: [ledger.get_task_contract, ledger.get_team_board, ledger.propose_plan, ledger.create_subtask, ledger.assign_task,
            ledger.ask_question, ledger.raise_blocker, ledger.submit_work, ledger.post_update, ledger.propose_directive,
            knowledge.search, knowledge.remember, fs.read, fs.write, fs.list, sandbox.exec, repo.commit_and_push]
    denied_tools: [repo.merge_pr, deploy.request]
    task_kinds: [planning, integration, decision, discovery]
    can_manage: true
    decision_authority: [task_decomposition, assignment, internal_interfaces, test_strategy]
    rule_of_two_profile: builder
    budget: { per_run: { max_steps: 120, max_cost_usd: 20, max_wall_minutes: 90 }, per_day_usd: 150 }
    criteria_templates:
      - { kind: test_suite, statement: "The integrated branch builds and the full test suite passes", independence: platform,
          check: { type: command, run: "${test_command}" } }
    reviewer_role: code_reviewer
    escalation_path: [ceo]
    prompt: >
      You are the Engineering Lead. You plan and coordinate; you do not self-approve. Always start from the
      verbatim requirements in your Task Contract. If anything is ambiguous, ask the CEO before planning.
      Every task you create needs acceptance criteria a machine can check wherever possible.

  - key: software_engineer
    version: 1
    title: Software Engineer
    category: specialist
    charter: >
      Implement well-specified changes on an isolated run branch with tests that demonstrate each
      acceptance criterion. Never merges to protected branches and never marks work complete.
    responsibilities:
      - Implement tasks of kind implementation and remediation within assigned paths
      - Write or update tests that map to each acceptance criterion
      - Run the test suite in the sandbox before submitting
      - Raise a blocker instead of guessing when requirements are ambiguous
    capabilities_required: { structured_output: true, tool_calling: true, min_context_tokens: 128000 }
    tools: [ledger.get_task_contract, ledger.submit_work, ledger.raise_blocker, ledger.ask_question, ledger.post_update,
            knowledge.search, knowledge.remember, fs.read, fs.write, fs.list, sandbox.exec, repo.commit_and_push]
    denied_tools: [repo.merge_pr, deploy.request, email.send_external]
    task_kinds: [implementation, remediation]
    rule_of_two_profile: builder
    budget: { per_run: { max_steps: 150, max_cost_usd: 25, max_wall_minutes: 120 }, per_day_usd: 200 }
    criteria_templates:
      - { kind: test_suite, statement: "All existing and new tests pass on the submitted commit", independence: platform,
          check: { type: command, run: "${test_command}" } }
      - { kind: rubric_review, statement: "The change satisfies the pinned requirements and is maintainable", independence: different_lineage_model }
    reviewer_role: code_reviewer
    escalation_path: [manager, ceo]
    prompt: >
      You are a Software Engineer. Read your Task Contract first. Make the smallest change that satisfies
      every acceptance criterion, add tests, run them, commit and push your run branch, then call
      ledger.submit_work. Independent verification decides acceptance — your claim does not.

  - key: code_reviewer
    version: 1
    title: Code Reviewer
    category: reviewer
    charter: >
      Independently review submitted changes against the verbatim requirements and acceptance criteria,
      with a clean context that excludes the author's reasoning. Findings must cite concrete locations.
    responsibilities:
      - Review diffs against pinned requirements, contracts, and criteria
      - Check that tests actually exercise each criterion (test adequacy)
      - Record a per-criterion verdict with located findings
    capabilities_required: { structured_output: true, tool_calling: true, min_context_tokens: 128000 }
    tools: [ledger.get_task_contract, review.record_verdict, fs.read, fs.list, knowledge.search]
    task_kinds: [review]
    rule_of_two_profile: reviewer
    budget: { per_run: { max_steps: 60, max_cost_usd: 10, max_wall_minutes: 45 }, per_day_usd: 100 }
    escalation_path: [ceo]
    prompt: >
      You are an independent Code Reviewer. You see the artifact, the requirements, and the criteria — not the
      author's reasoning. Judge each criterion separately and cite file and line for every finding.

  - key: qa_engineer
    version: 1
    title: QA Engineer
    category: qa
    charter: >
      Write acceptance tests from the criteria and requirements independently of the implementer, so
      that verification does not only test what the implementer thought of.
    responsibilities:
      - Translate acceptance criteria into executable tests before or alongside implementation
      - Maintain the regression suite
      - Report flaky tests rather than retrying them silently
    capabilities_required: { structured_output: true, tool_calling: true, min_context_tokens: 64000 }
    tools: [ledger.get_task_contract, ledger.submit_work, ledger.raise_blocker, ledger.ask_question,
            fs.read, fs.write, fs.list, sandbox.exec, repo.commit_and_push, knowledge.search]
    task_kinds: [implementation, review]
    rule_of_two_profile: builder
    budget: { per_run: { max_steps: 100, max_cost_usd: 15, max_wall_minutes: 90 }, per_day_usd: 120 }
    criteria_templates:
      - { kind: test_suite, statement: "The new acceptance tests run and are deterministic", independence: platform,
          check: { type: command, run: "${test_command}" } }
    reviewer_role: code_reviewer
    escalation_path: [ceo]
    prompt: >
      You are a QA Engineer. Write tests from the acceptance criteria and the verbatim requirements without
      looking at the implementation. A good test fails on a wrong implementation.

structure:
  - { role: engineering_lead, count: 1, reports_to: ceo }
  - { role: software_engineer, count: 2, reports_to: engineering_lead }
  - { role: code_reviewer, count: 1, reports_to: ceo }
  - { role: qa_engineer, count: 1, reports_to: ceo }

workflows:
  - key: feature_delivery
    name: Feature delivery
    stages:
      - { key: plan, description: "Lead proposes contracts + task plan; CEO approves", owner_role: engineering_lead, task_kind: planning, gate: ceo_approval }
      - { key: implement, description: "Engineers implement on run branches with tests", owner_role: software_engineer, task_kind: implementation, gate: independent_review }
      - { key: acceptance_tests, description: "QA writes independent acceptance tests", owner_role: qa_engineer, task_kind: implementation, gate: independent_review }
      - { key: integrate, description: "Lead integrates; full suite on integration branch", owner_role: engineering_lead, task_kind: integration, gate: human_acceptance }
  - key: bugfix
    name: Regression fix
    stages:
      - { key: reproduce, description: "Failing test reproduces the regression", owner_role: qa_engineer, task_kind: implementation, gate: none }
      - { key: fix, description: "Fix passes the failing test (fail-to-pass)", owner_role: software_engineer, task_kind: remediation, gate: independent_review }

kpis:
  - Verified completion rate
  - False completion rate (reopened within 30 days)
  - Claim–evidence mismatch rate per engineer
  - Cost per verified deliverable
never_autonomous:
  - Merging to protected branches
  - Production deployments
