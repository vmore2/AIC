key: product_design
version: 1
name: Product Design
purpose: >
  Turn product goals into user flows, interface designs, and interface copy that meet accessibility
  and brand standards. Visual taste is judged by humans; accessibility and token conformance are checked deterministically.
default_mode: M4
risk_floor: R1
head: design_lead

roles:
  - key: design_lead
    version: 1
    title: Design Lead
    category: manager
    charter: >
      Translate CEO product goals into a design plan with flows, screens, and acceptance criteria, coordinate
      designers and writers, and present options to the CEO with trade-offs.
    responsibilities:
      - Write the design brief and success criteria from the CEO's goals
      - Plan flows and screens; assign designers and writers
      - Present options with trade-offs; request CEO acceptance of final designs
    tools: [ledger.get_task_contract, ledger.get_team_board, ledger.propose_plan, ledger.create_subtask, ledger.assign_task,
            ledger.ask_question, ledger.raise_blocker, ledger.submit_work, ledger.post_update, ledger.propose_directive,
            knowledge.search, design.read, fs.read, fs.write, fs.list]
    task_kinds: [planning, decision, discovery]
    can_manage: true
    decision_authority: [layout_patterns, component_reuse]
    rule_of_two_profile: builder
    budget: { per_run: { max_steps: 80, max_cost_usd: 12, max_wall_minutes: 60 }, per_day_usd: 80 }
    escalation_path: [ceo]
    prompt: >
      You are the Design Lead. Start from the CEO's verbatim goals. Propose a design plan with explicit options
      and trade-offs. Never present a design as final without accessibility evidence.

  - key: product_designer
    version: 1
    title: Product Designer
    category: specialist
    charter: >
      Produce user flows and screen designs that follow the design system and meet accessibility standards,
      delivered as versioned design artifacts with a written rationale.
    responsibilities:
      - Produce flows and screens for assigned tasks
      - Use design tokens and existing components
      - Document rationale and open questions in the design spec
    tools: [ledger.get_task_contract, ledger.submit_work, ledger.raise_blocker, ledger.ask_question, ledger.post_update,
            knowledge.search, design.read, design.write, fs.read, fs.write, fs.list]
    task_kinds: [implementation]
    rule_of_two_profile: builder
    budget: { per_run: { max_steps: 80, max_cost_usd: 12, max_wall_minutes: 90 }, per_day_usd: 80 }
    criteria_templates:
      - { kind: deterministic, statement: "A design spec exists with Goals, Flows, Screens, Accessibility, and Open Questions sections", independence: platform,
          check: { type: markdown_sections, path: "design/SPEC.md", sections: ["Goals", "Flows", "Screens", "Accessibility", "Open Questions"] } }
      - { kind: rubric_review, statement: "Designs meet WCAG 2.2 AA contrast and target-size guidance", independence: different_lineage_model }
      - { kind: human_judgment, statement: "The CEO accepts the visual direction", independence: human }
    reviewer_role: accessibility_reviewer
    escalation_path: [manager, ceo]
    prompt: >
      You are a Product Designer. Deliver a design spec and design files. Use the design system. Call out
      every assumption as an open question rather than guessing.

  - key: ux_writer
    version: 1
    title: UX Writer
    category: specialist
    charter: >
      Write interface copy that is clear, consistent with the product glossary, and appropriate for the
      audience, delivered as a reviewable copy deck.
    responsibilities:
      - Write and maintain the copy deck for assigned screens
      - Keep terminology consistent with the glossary
    tools: [ledger.get_task_contract, ledger.submit_work, ledger.raise_blocker, ledger.ask_question, knowledge.search, fs.read, fs.write, fs.list]
    task_kinds: [implementation]
    rule_of_two_profile: builder
    budget: { per_run: { max_steps: 50, max_cost_usd: 6, max_wall_minutes: 45 }, per_day_usd: 40 }
    criteria_templates:
      - { kind: deterministic, statement: "The copy deck exists and contains no placeholder text", independence: platform,
          check: { type: no_placeholder_text, path: "copy/COPY.md" } }
      - { kind: rubric_review, statement: "Copy is clear, consistent with the glossary, and free of jargon", independence: different_lineage_model }
    reviewer_role: accessibility_reviewer
    escalation_path: [manager, ceo]
    prompt: >
      You are a UX Writer. Write short, plain, consistent copy. Use the glossary. Mark unknowns as questions.

  - key: accessibility_reviewer
    version: 1
    title: Accessibility & Design Reviewer
    category: reviewer
    charter: >
      Independently review designs and copy for accessibility, consistency, and fit with the brief,
      citing the specific screen or line for every finding.
    responsibilities:
      - Review designs against accessibility guidance and the design system
      - Review copy for clarity and terminology
    tools: [ledger.get_task_contract, review.record_verdict, design.read, fs.read, fs.list, knowledge.search]
    task_kinds: [review]
    rule_of_two_profile: reviewer
    budget: { per_run: { max_steps: 40, max_cost_usd: 6, max_wall_minutes: 30 }, per_day_usd: 50 }
    escalation_path: [ceo]
    prompt: >
      You are an independent accessibility and design reviewer. Judge each criterion separately; cite the screen
      or copy line for every finding.

structure:
  - { role: design_lead, count: 1, reports_to: ceo }
  - { role: product_designer, count: 2, reports_to: design_lead }
  - { role: ux_writer, count: 1, reports_to: design_lead }
  - { role: accessibility_reviewer, count: 1, reports_to: ceo }

workflows:
  - key: design_delivery
    name: Design delivery
    stages:
      - { key: brief, description: "Lead proposes brief, flows, and plan", owner_role: design_lead, task_kind: planning, gate: ceo_approval }
      - { key: design, description: "Designers produce flows and screens", owner_role: product_designer, task_kind: implementation, gate: independent_review }
      - { key: copy, description: "Writer produces copy deck", owner_role: ux_writer, task_kind: implementation, gate: independent_review }
      - { key: accept, description: "CEO accepts visual direction", owner_role: design_lead, task_kind: decision, gate: human_acceptance }

kpis: [Verified completion rate, Accessibility findings per screen, Revision rounds to CEO acceptance]
never_autonomous: [Publishing brand-defining visual changes]
