<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The AI Company — CEO</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e4e4df; --accent:#2f5bd3; --ok:#1f8a4c; --warn:#b7791f; --bad:#c0392b; --chip:#eef1fb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --panel:#1b1b1b; --ink:#ececea; --muted:#9a9a94; --line:#2c2c2a; --accent:#7ea0ff; --chip:#22283a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:2; }
  header h1 { font-size:16px; margin:0; }
  header .spacer { flex:1; }
  nav button { background:none; border:0; color:var(--muted); font:inherit; padding:6px 10px; border-radius:6px; cursor:pointer; }
  nav button.active { color:var(--ink); background:var(--chip); }
  .estop { background:var(--bad); color:#fff; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; }
  main { max-width:1100px; margin:0 auto; padding:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--muted); }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; background:var(--chip); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .bars { display:grid; grid-template-columns: 90px 1fr 48px; gap:6px 10px; align-items:center; margin:10px 0 4px; }
  .bar { height:10px; background:var(--line); border-radius:99px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--accent); }
  .bar.claimed > span { background:var(--muted); opacity:.6; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--muted); font-size:12px; }
  button.act, a.btn { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  a.btn { display:inline-block; text-decoration:none; }
  button.sec { background:none; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  textarea, input, select { width:100%; font:inherit; padding:8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .chat { display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 12px; border-radius:10px; max-width:80%; white-space:pre-wrap; }
  .msg.me { align-self:flex-end; background:var(--chip); }
  .msg.them { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
  label.chk { display:inline-block; color:var(--ink); font-size:13px; margin:2px 14px 2px 0; }
  button[disabled] { opacity:.5; cursor:not-allowed; }
  pre { white-space:pre-wrap; background:var(--bg); padding:10px; border-radius:6px; border:1px solid var(--line); max-height:260px; overflow:auto; }
  .flag { color:var(--bad); font-weight:600; }
  @media (max-width: 640px) { header { flex-wrap:wrap; } main { padding:16px; } }
</style>
</head>
<body>
<header>
  <h1 id="company">The AI Company</h1>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <span class="muted" id="me"></span>
  <span class="muted" id="fresh"></span>
  <button class="estop" id="estop" title="Stop all consequential work and fence in-flight runs">■ Emergency stop</button>
</header>
<main id="view"></main>
<script>
const TOKEN = (location.hash.match(/token=([^&]+)/) || [])[1] || sessionStorage.getItem('aic-token') || '';
if (TOKEN) { sessionStorage.setItem('aic-token', TOKEN); history.replaceState(null, '', location.pathname); }
const api = async (p, opts = {}) => {
  const auth = TOKEN ? { 'x-aic-token': TOKEN } : { 'x-requested-with': 'aic' };
  const r = await fetch(p, { ...opts, headers: { 'content-type': 'application/json', ...auth, 'idempotency-key': crypto.randomUUID(), ...(opts.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  // Governance actions need a fresh Google sign-in: re-verify, then the CEO repeats the action.
  if (r.status === 403 && body.step_up_url) { location.href = body.step_up_url; throw new Error('Confirming it is you — redirecting to Google…'); }
  if (!r.ok) throw new Error(body.title || r.statusText);
  return body;
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const views = { Overview: overview, Inbox: inboxView, Org: team, Teams: teamsView, 'Build a team': () => builder(), Talk: talk, People: people, Audit: audit };
let current = 'Overview';
const nav = document.getElementById('nav');
function renderNav() { nav.innerHTML = Object.keys(views).map((k) => `<button class="${k === current ? 'active' : ''}" data-v="${k}">${k}</button>`).join(''); }
nav.onclick = (e) => { const v = e.target.dataset.v; if (v) { current = v; if (v === 'Build a team') draft = null; renderNav(); refresh(); } };
const view = document.getElementById('view');
async function refresh() {
  try { await views[current](); document.getElementById('fresh').textContent = 'updated ' + new Date().toLocaleTimeString(); }
  catch (e) { view.innerHTML = `<div class="card bad">${esc(e.message)}</div>`; }
}
const delivery = (d) => `<span class="pill ${d === 'done' || d === 'on_track' ? 'ok' : d === 'blocked' ? 'bad' : 'warn'}">${d.replace('_', ' ')}</span>`;

async function overview() {
  const s = await api('/api/status');
  document.getElementById('company').textContent = s.company?.name || 'The AI Company';
  if (!s.objectives.length) { view.innerHTML = `<div class="card">No objectives yet. Use <b>Talk</b> to brief a team lead.</div>`; return; }
  view.innerHTML = s.objectives.map((o) => `
    <div class="card">
      <div class="row"><b>${esc(o.title)}</b><span class="muted">${esc(o.department)}</span>${delivery(o.delivery)}<span class="spacer"></span>
        ${o.pendingDecisions ? `<span class="pill warn">${o.pendingDecisions} decision(s) waiting</span>` : ''}</div>
      <div class="bars">
        <span>Verified</span><div class="bar"><span style="width:${o.verifiedPct}%"></span></div><span>${o.verifiedPct}%</span>
        <span>Claimed</span><div class="bar claimed"><span style="width:${o.claimedPct}%"></span></div><span>${o.claimedPct}%</span>
      </div>
      ${o.discrepancy > 0 ? `<div class="warn">⚠ ${o.discrepancy} points claimed by employees but not yet independently verified.</div>` : ''}
      <div class="muted">${esc(o.deliveryReason)} · Budget $${o.budget.spent.toFixed(2)} / $${o.budget.limit.toFixed(2)} · ${Object.entries(o.tasks.byStatus).map(([k, v]) => `${k} ${v}`).join(' · ')}</div>
      <div style="margin-top:8px"><button class="sec" onclick="tasks('${o.id}')">Tasks</button> <button class="sec" onclick="requirements('${o.id}')">Requirements</button>
        ${o.status === 'completed' ? `<button class="act" onclick="release('${o.id}')">Approve release to main</button>` : ''}</div>
    </div>`).join('');
}
async function requirements(objectiveId) {
  const reqs = await api(`/api/objectives/${objectiveId}/requirements`);
  view.innerHTML = `<div class="card"><button class="sec" onclick="refresh()">← Back</button><h3>Requirements</h3>
    <p class="muted">Changing a requirement keeps its history, withdraws unaccepted work built on the old version, and asks the lead to re-plan for your approval. Accepted work stays accepted against the version it was built for.</p>
    <table><tr><th>Key</th><th>Version</th><th>Text (verbatim)</th></tr>${reqs.map((r) => `<tr><td>${r.key}</td><td>v${r.version}</td><td>${esc(r.text)}</td></tr>`).join('')}</table>
    <h4>Change or add a requirement</h4>
    <div class="row"><div style="width:120px"><label>Key</label><input id="rq-key" placeholder="REQ-${reqs.length + 1}"></div><div style="flex:1"><label>Why</label><input id="rq-why" placeholder="Reason for the change"></div></div>
    <label>New text</label><textarea id="rq-text" rows="3"></textarea>
    <p><button class="act" onclick="submitRequirement('${objectiveId}')">Apply change</button></p><div id="rq-out"></div></div>`;
}
async function submitRequirement(objectiveId) {
  const key = document.getElementById('rq-key').value.trim(), text = document.getElementById('rq-text').value.trim(), reason = document.getElementById('rq-why').value.trim();
  try {
    const r = await api(`/api/objectives/${objectiveId}/requirements`, { method: 'POST', body: JSON.stringify({ key, text, reason }) });
    document.getElementById('rq-out').innerHTML = `<div class="ok">${key} is now v${r.version}. Withdrew ${r.superseded.length} task(s); ${r.keptAccepted.length} accepted task(s) kept. The lead will re-plan; watch your Inbox.</div>`;
  } catch (e) { document.getElementById('rq-out').innerHTML = `<div class="bad">${esc(e.message)}</div>`; }
}
async function tasks(objectiveId) {
  const rows = await api('/api/tasks?objective=' + objectiveId);
  view.innerHTML = `<div class="card"><button class="sec" onclick="refresh()">← Back</button><table><tr><th>Task</th><th>Owner</th><th>Status</th><th>Attempt</th><th>Assurance</th></tr>
    ${rows.map((t) => `<tr><td><a href="#" onclick="task('${t.id}');return false">${esc(t.title)}</a><div class="muted">${t.kind}</div></td><td>${esc(t.owner)}</td>
      <td>${t.status}${t.hold ? ` <span class="bad">HOLD ${t.hold}</span>` : ''}</td><td>${t.attempt}</td><td>${t.assurance_label || ''}</td></tr>`).join('')}</table></div>`;
}
async function task(id) {
  const d = await api('/api/tasks/' + id);
  const t = d.task;
  view.innerHTML = `<div class="card"><button class="sec" onclick="tasks('${t.objective_id}')">← Tasks</button>
    <h3>${esc(t.title)}</h3><div class="muted">${t.status} · risk ${t.risk_tier} · attempt ${t.attempt}/${t.max_attempts} · owner ${esc(t.owner_name)} ${t.assurance_label ? '· ' + t.assurance_label : ''}</div>
    ${d.requirements.map((r) => `<div class="muted">${r.key}@v${r.version}: ${esc(r.text)}</div>`).join('')}
    <h4>Claim vs evidence</h4><table><tr><th>Criterion</th><th>Employee claimed</th><th>Platform verified</th></tr>
    ${d.claimVsEvidence.map((x) => `<tr><td>${esc(x.criterion)}</td><td>${x.claimed || '—'}</td><td class="${x.verified === 'passed' ? 'ok' : x.verified === 'failed' ? 'bad' : 'warn'}">${x.verified}
      ${x.claimed === 'met' && x.verified === 'failed' ? '<div class="flag">claim contradicted by evidence</div>' : ''}</td></tr>`).join('')}</table>
    ${t.status === 'awaiting_acceptance' ? `<p><textarea id="ask" rows="2" placeholder="Rationale (required to request changes)"></textarea></p><p><button class="act" onclick="decideTask('${t.id}','accept')">Accept</button> <button class="sec" onclick="decideTask('${t.id}','reject')">Request changes</button></p>` : ''}
    ${['planned', 'ready', 'in_progress', 'awaiting_input', 'changes_requested', 'failed'].includes(t.status) ? `<div id="reassign" class="row" style="margin:10px 0"></div>` : ''}
    <h4>Runs</h4>${d.runs.map((r) => `<div>${r.mode} · ${esc(r.employee)} · ${r.status}${r.failure_reason ? ' (' + esc(r.failure_reason) + ')' : ''}</div>`).join('')}
    <h4>Timeline (ledger)</h4><pre>${d.timeline.map((e) => `${e.seq} ${e.at} ${e.type} ${JSON.stringify(e.payload).slice(0, 160)}`).join('\n')}</pre></div>`;
  loadReassign(t.id);
}
async function loadReassign(id) {
  const box = document.getElementById('reassign'); if (!box) return;
  const cands = await api(`/api/tasks/${id}/candidates`);
  if (!cands.length) { box.innerHTML = '<span class="muted">No other team member can take this task.</span>'; return; }
  box.innerHTML = `<select id="ra-who" style="width:auto">${cands.map((c) => `<option value="${c.id}">${esc(c.display_name)}</option>`).join('')}</select>
    <input id="ra-why" placeholder="Why reassign?" style="flex:1"><button class="sec" onclick="reassign('${id}')">Reassign</button>`;
}
async function reassign(id) {
  const reason = document.getElementById('ra-why').value.trim();
  if (!reason) { alertBox('Give a reason for reassigning.'); return; }
  try { await api(`/api/tasks/${id}/reassign`, { method: 'POST', body: JSON.stringify({ employeeId: document.getElementById('ra-who').value, reason }) }); task(id); }
  catch (e) { alertBox(e.message); }
}
async function decideTask(id, what) {
  const rationale = what === 'reject' ? window.__ask('What should change?') : '';
  if (what === 'reject' && !rationale) return;
  await api(`/api/tasks/${id}/${what}`, { method: 'POST', body: JSON.stringify({ rationale }) }); task(id);
}
window.__ask = (q) => { const v = document.getElementById('ask'); return v ? v.value : ''; };

async function inboxView() {
  const items = await api('/api/inbox');
  if (!items.length) { view.innerHTML = '<div class="card ok">Inbox zero.</div>'; return; }
  view.innerHTML = `<div class="card"><label class="muted">Note / rationale for your next decision</label><textarea id="ask" rows="2" placeholder="Optional (required when requesting changes)"></textarea></div>` +
    (await Promise.all(items.map(async (i) => {
      let extra = '';
      if (i.kind === 'plan') {
        const p = await api('/api/proposals/' + i.id);
        extra = `<table><tr><th>Task</th><th>Owner</th><th>Covers</th><th>Budget</th></tr>${p.content.tasks.map((t) => `<tr><td>${esc(t.title)}<div class="muted">${esc(t.spec)}</div></td><td>${t.owner_role}</td><td>${t.requirement_keys.join(', ')}</td><td>$${t.budget_usd}</td></tr>`).join('')}</table>
          <p><button class="act" onclick="decidePlan('${i.id}','approve')">Approve plan</button> <button class="sec" onclick="decidePlan('${i.id}','request_changes')">Request changes</button></p>`;
      } else if (i.kind === 'directive') {
        const d = await api('/api/directives/' + i.id);
        extra = `<pre>${esc(JSON.stringify(d.payload, null, 2))}</pre><p><button class="act" onclick="directive('${i.id}','confirm')">Confirm</button> <button class="sec" onclick="directive('${i.id}','decline')">Decline</button></p>`;
      } else if (i.kind === 'escalation') {
        extra = `<p><button class="act" onclick="resolveEsc('${i.id}')">Answer with the note above</button></p>`;
      } else if (i.kind === 'note') {
        extra = `<p><button class="act" onclick="curate('${i.id}','approve')">Approve note</button> <button class="sec" onclick="curate('${i.id}','reject')">Reject</button></p>`;
      } else if (i.kind === 'release') {
        extra = `<p><button class="act" onclick="release('${i.id}')">Approve release</button></p>`;
      } else {
        extra = `<p><button class="sec" onclick="task('${i.id}')">Open</button></p>`;
      }
      return `<div class="card"><b>${esc(i.title)}</b><div class="muted">${esc(i.detail)}</div>${extra}</div>`;
    }))).join('');
}
async function decidePlan(id, decision) {
  const rationale = window.__ask();
  if (decision === 'request_changes' && !rationale) { alertBox('Write what should change in the note box first.'); return; }
  await api(`/api/proposals/${id}/decision`, { method: 'POST', body: JSON.stringify({ decision, rationale }) }); refresh();
}
async function directive(id, what) { await api(`/api/directives/${id}/${what}`, { method: 'POST', body: JSON.stringify({ reason: window.__ask() }) }); refresh(); }
async function resolveEsc(id) { const answer = window.__ask(); if (!answer) { alertBox('Write your answer in the note box first.'); return; } await api(`/api/escalations/${id}/resolve`, { method: 'POST', body: JSON.stringify({ answer }) }); refresh(); }
async function curate(id, decision) { await api(`/api/notes/${id}`, { method: 'POST', body: JSON.stringify({ decision, reason: window.__ask() }) }); refresh(); }
async function release(id) { await api(`/api/objectives/${id}/release`, { method: 'POST', body: '{}' }); refresh(); }
function alertBox(text) { view.insertAdjacentHTML('afterbegin', `<div class="card warn">${esc(text)}</div>`); }

async function team() {
  const deps = await api('/api/team');
  view.innerHTML = deps.map((d) => `<div class="card"><b>${esc(d.name)}</b> <span class="muted">default mode ${d.default_mode}</span>
    <table><tr><th>Employee</th><th>Category</th><th>Active</th><th>Accepted</th><th>Rework</th><th>Model</th></tr>
    ${d.employees.map((e) => `<tr><td>${esc(e.display_name)}</td><td>${e.category}</td><td>${e.active}</td><td>${e.accepted}</td><td>${e.reworkRate === null ? '—' : e.reworkRate + '%'}</td><td class="muted">${esc(e.model_profile)}</td></tr>`).join('')}</table></div>`).join('')
    || '<div class="card">No teams hired yet. Open <b>Teams</b> to hire one.</div>';
}

const chatLog = [];
async function talk() {
  const deps = await api('/api/team');
  const leads = deps.flatMap((d) => d.employees.filter((e) => e.category === 'manager'));
  view.innerHTML = `<div class="card"><div class="row"><select id="who">${leads.map((l) => `<option value="${l.id}">${esc(l.display_name)}</option>`).join('')}</select></div>
    <div class="chat" id="log" style="margin:14px 0">${chatLog.join('')}</div>
    <textarea id="say" rows="3" placeholder="Tell your team lead what you need…"></textarea>
    <p><button class="act" id="send">Send</button> <span class="muted">Leads answer from the ledger. Anything that changes work comes back as a proposal you confirm.</span></p></div>`;
  document.getElementById('send').onclick = async () => {
    const message = document.getElementById('say').value.trim(); if (!message) return;
    chatLog.push(`<div class="msg me">${esc(message)}</div>`); talk();
    const r = await api('/api/chat', { method: 'POST', body: JSON.stringify({ employee: document.getElementById('who').value, message }) });
    chatLog.push(`<div class="msg them"><b>${esc(r.employee)}</b>\n${esc(r.reply)}${r.directives.map((d) => `\n\n◆ Proposal awaiting your confirmation: ${esc(d.summary)} — see Inbox`).join('')}</div>`);
    talk();
  };
}
async function audit() {
  const a = await api('/api/audit'); const ev = await api('/api/events');
  view.innerHTML = `<div class="card"><b class="${a.ok ? 'ok' : 'bad'}">${a.ok ? `Ledger hash chain intact (${a.checked} events)` : `TAMPERING DETECTED at event ${a.brokenAt}`}</b></div>
    <div class="card"><table><tr><th>#</th><th>Event</th><th>Actor</th><th>Detail</th></tr>${ev.map((e) => `<tr><td>${e.seq}</td><td>${e.type}</td><td class="muted">${esc(e.actor.type)}:${esc(e.actor.id).slice(0, 18)}</td><td class="muted">${esc(JSON.stringify(e.payload).slice(0, 140))}</td></tr>`).join('')}</table></div>`;
}
document.getElementById('estop').onclick = async () => {
  if (document.getElementById('estop').dataset.armed !== '1') { document.getElementById('estop').dataset.armed = '1'; document.getElementById('estop').textContent = 'Click again to STOP'; return; }
  await api('/api/emergency-stop', { method: 'POST', body: JSON.stringify({ reason: 'dashboard emergency stop' }) });
  document.getElementById('estop').textContent = 'STOPPED'; refresh();
};

// ---------------------------------------------------------------- people (who can sign in)
const ROLE_HELP = { approver: 'approves plans, accepts work, curates team notes', viewer: 'read-only', auditor: 'read-only + audit trail', member: 'talks to teams', admin: 'manages people and teams' };
async function people(note = '') {
  const users = await api('/api/users');
  view.innerHTML = `${note}<div class="card"><b>Add a person</b>
    <p class="muted">They sign in with Google using this email. Adding people is a governance action: you may be asked to confirm with Google first.</p>
    <div class="row"><input id="pname" placeholder="Name"><input id="pemail" placeholder="name@gmail.com" type="email">
      <select id="prole" style="width:auto">${Object.keys(ROLE_HELP).map((r) => `<option value="${r}">${r}</option>`).join('')}</select>
      <button class="act" id="padd">Add</button></div><div class="muted" id="prolehelp">${ROLE_HELP.approver}</div></div>
    <div class="card"><table><tr><th>Name</th><th>Role</th><th>Signs in as</th><th>Tokens</th><th></th></tr>
    ${users.map((u) => `<tr><td>${esc(u.name)}</td><td>${u.role}</td><td>${u.email ? esc(u.email) : '<span class="muted">no access</span>'}</td><td>${u.active_tokens}</td>
      <td>${u.role !== 'ceo' && (u.email || u.active_tokens) ? `<button class="sec" data-remove="${u.id}">Remove access</button>` : ''}</td></tr>`).join('')}</table></div>`;
  document.getElementById('prole').onchange = (e) => { document.getElementById('prolehelp').textContent = ROLE_HELP[e.target.value]; };
  document.getElementById('padd').onclick = async () => {
    try {
      const r = await api('/api/users', { method: 'POST', body: JSON.stringify({ name: document.getElementById('pname').value, email: document.getElementById('pemail').value, role: document.getElementById('prole').value }) });
      people(`<div class="card ok">Added. ${esc(r.signIn)}</div>`);
    } catch (e) { people(`<div class="card bad">${esc(e.message)}</div>`); }
  };
  view.querySelectorAll('[data-remove]').forEach((b) => b.onclick = async () => {
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Click again to remove'; return; }
    try { await api(`/api/users/${b.dataset.remove}/remove`, { method: 'POST', body: '{}' }); people('<div class="card ok">Access removed; their sessions and tokens no longer work.</div>'); }
    catch (e) { people(`<div class="card bad">${esc(e.message)}</div>`); }
  });
}

// ---------------------------------------------------------------- team catalog
async function teamsView() {
  const teams = await api('/api/catalog');
  const card = (t) => `
    <div class="card">
      <div class="row"><b>${esc(t.name)}</b><span class="pill">${t.source === 'recommended' ? 'Recommended' : 'Custom'}</span>
        ${t.format === 'team_spec' ? '<span class="pill">short spec</span>' : ''}${t.hired ? '<span class="pill ok">hired</span>' : ''}
        ${t.errors.length ? `<span class="pill bad">${t.errors.length} error(s)</span>` : ''}<span class="spacer"></span>
        <span class="muted">mode ${t.mode || '?'} · risk ${t.risk || '?'}</span></div>
      <div class="muted" style="margin:6px 0">${esc(t.purpose)}</div>
      <table><tr><th>Role</th><th>Type</th><th>Seats</th><th>Does</th></tr>
        ${t.roles.map((r) => `<tr><td>${esc(r.title)}</td><td>${r.category}</td><td>${r.count}</td><td class="muted">${esc(r.does)}</td></tr>`).join('')}</table>
      ${t.errors.map((x) => `<div class="bad">✖ ${esc(x)}</div>`).join('')}
      <p>${t.hired ? '' : `<button class="act" ${t.errors.length ? 'disabled' : ''} onclick="hireTeam('${t.key}')">Hire</button>`}
        <button class="sec" onclick="teamDetail('${t.key}')">Details</button>
        ${t.format === 'team_spec' ? `<button class="sec" onclick="builder('${t.key}')">${t.source === 'custom' ? 'Edit' : 'Copy as custom team'}</button>` : ''}</p>
    </div>`;
  view.innerHTML = `<div class="card row"><b>Team catalog</b><span class="muted">Recommended teams ship with the platform; custom teams are yours.</span><span class="spacer"></span>
      <button class="act" onclick="current='Build a team';renderNav();builder()">+ Build a team</button></div>` + teams.map(card).join('');
}
async function hireTeam(key) {
  try { const r = await api(`/api/catalog/${key}/hire`, { method: 'POST', body: '{}' }); alertBox(`Hired ${r.employees.length} employees. Brief the lead in Talk.`); }
  catch (e) { alertBox(e.message); return; }
  teamsView();
}
async function teamDetail(key) {
  const t = (await api('/api/catalog')).find((x) => x.key === key);
  view.innerHTML = `<div class="card"><button class="sec" onclick="teamsView()">← Catalog</button><h3>${esc(t.name)}</h3><div class="muted">${esc(t.purpose)}</div>
    <h4>Workflow</h4><div>${t.workflow.map((s) => `${s.key}${s.gate !== 'none' ? ` <span class="pill">${s.gate.replace('_', ' ')}</span>` : ''}`).join(' → ')}</div>
    ${t.roles.map((r) => `<h4>${esc(r.title)} <span class="muted">(${r.category}, ${r.profile}, ×${r.count}, reports to ${esc(r.reportsTo)})</span></h4>
      <div>${esc(r.does)}</div>
      <div class="muted">Tools: ${r.tools.join(', ')}</div>
      ${r.criteria.length ? `<div>Acceptance:<ul>${r.criteria.map((c) => `<li>${esc(c.statement)} <span class="muted">— ${c.kind}, verified by ${c.by}</span></li>`).join('')}</ul></div>` : ''}
      ${r.reviewer ? `<div class="muted">Reviewed by ${r.reviewer}</div>` : ''}`).join('')}
    <h4>Never autonomous</h4><div>${t.neverAutonomous.map(esc).join('; ') || '—'}</div>
    ${[...t.warnings, ...t.notes].map((x) => `<div class="warn">! ${esc(x)}</div>`).join('')}</div>`;
}

// ---------------------------------------------------------------- team builder
let draft = null;
let caps = [];
const blankRole = (o = {}) => ({ title: '', does: '', count: 1, type: 'member', works_with: ['documents'], reviews: [], document: '', sections: '', human_judges: '', affects_people: false, ...o });
function toSpec(d) {
  return {
    team: d.team, name: d.name, purpose: d.purpose, mode: d.mode, risk: d.risk,
    never_autonomous: d.never.split('\n').map((x) => x.trim()).filter(Boolean),
    roles: d.roles.map((r) => {
      const o = { title: r.title, does: r.does, count: Number(r.count) || 1 };
      if (r.type === 'lead') o.lead = true;
      if (r.type === 'qa') o.qa = true;
      if (r.type === 'reviewer') o.reviews = r.reviews;
      if (r.works_with.length) o.works_with = r.works_with;
      if (r.document) o.delivers = [{ document: r.document, ...(r.sections ? { sections: r.sections.split(',').map((s) => s.trim()).filter(Boolean) } : {}) }];
      if (r.human_judges) o.human_judges = r.human_judges;
      if (r.affects_people) o.affects_people = true;
      return o;
    }),
  };
}
function fromSpec(s) {
  return {
    team: s.team, name: s.name, purpose: s.purpose, mode: s.mode || 'plan_gates', risk: s.risk || 'standard', never: (s.never_autonomous || []).join('\n'),
    roles: s.roles.map((r) => blankRole({
      title: r.title, does: r.does, count: r.count || 1, type: r.lead ? 'lead' : r.qa ? 'qa' : (r.reviews || []).length ? 'reviewer' : 'member',
      works_with: r.works_with || ['documents'], reviews: r.reviews || [], document: r.delivers?.find((x) => x.document)?.document || '',
      sections: (r.delivers?.find((x) => x.document)?.sections || []).join(', '), human_judges: r.human_judges || '', affects_people: !!r.affects_people,
    })),
  };
}
async function builder(fromKey) {
  if (!caps.length) caps = await api('/api/capabilities');
  if (fromKey) { draft = fromSpec(await api(`/api/catalog/${fromKey}/spec`)); }
  else if (!draft) draft = { team: '', name: '', purpose: '', mode: 'plan_gates', risk: 'standard', never: 'Anything sent outside the company',
    roles: [blankRole({ type: 'lead', title: '', does: '' }), blankRole(), blankRole({ type: 'reviewer' })] };
  renderBuilder();
}
function renderBuilder(result) {
  const d = draft;
  const titles = d.roles.map((r) => r.title).filter(Boolean);
  view.innerHTML = `<div class="card">
    <b>Build a team</b> <span class="muted">Describe the roles. The platform derives tools, acceptance checks, review chain, workflow, and safeguards.</span>
    <div class="row" style="margin-top:10px"><div style="flex:2"><label>Team name</label><input id="b-name" value="${esc(d.name)}" placeholder="Growth Marketing"></div>
      <div style="flex:1"><label>Key</label><input id="b-team" value="${esc(d.team)}" placeholder="growth_marketing"></div>
      <div style="flex:1"><label>Oversight</label><select id="b-mode">${['autonomous', 'exceptions', 'milestones', 'plan_gates', 'supervised'].map((m) => `<option ${m === d.mode ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
      <div style="flex:1"><label>Risk</label><select id="b-risk">${['low', 'standard', 'high', 'critical'].map((m) => `<option ${m === d.risk ? 'selected' : ''}>${m}</option>`).join('')}</select></div></div>
    <label>Purpose</label><textarea id="b-purpose" rows="2" placeholder="What this team is for and what good output looks like">${esc(d.purpose)}</textarea>
    <label>Never autonomous (one per line)</label><textarea id="b-never" rows="2">${esc(d.never)}</textarea></div>
    ${d.roles.map((r, i) => `<div class="card">
      <div class="row"><div style="flex:2"><label>Role title</label><input data-i="${i}" data-f="title" value="${esc(r.title)}" placeholder="Content Strategist"></div>
        <div style="flex:1"><label>Type</label><select data-i="${i}" data-f="type">${[['lead', 'Lead (plans, reports to CEO)'], ['member', 'Team member'], ['reviewer', 'Independent reviewer'], ['qa', 'QA (outside the chain)']].map(([v, l]) => `<option value="${v}" ${v === r.type ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div style="width:90px"><label>Seats</label><input type="number" min="1" max="10" data-i="${i}" data-f="count" value="${r.count}"></div>
        <button class="sec" onclick="removeRole(${i})" title="Remove role">✕</button></div>
      <label>What this role does</label><textarea rows="2" data-i="${i}" data-f="does" placeholder="One or two sentences">${esc(r.does)}</textarea>
      ${r.type === 'reviewer' ? `<label>Reviews</label><div>${titles.filter((t) => t !== r.title).map((t) => `<label class="chk"><input type="checkbox" style="width:auto" data-i="${i}" data-f="reviews" value="${esc(t)}" ${r.reviews.includes(t) ? 'checked' : ''}> ${esc(t)}</label>`).join('') || '<span class="muted">Add role titles first</span>'}</div>` : ''}
      <label>Works with</label><div>${caps.map((c) => `<label class="chk" title="${esc(c.label)}"><input type="checkbox" style="width:auto" data-i="${i}" data-f="works_with" value="${c.key}" ${r.works_with.includes(c.key) ? 'checked' : ''}> ${c.key}</label>`).join('')}</div>
      ${r.type === 'member' || r.type === 'qa' ? `<div class="row"><div style="flex:1"><label>Delivers document (path)</label><input data-i="${i}" data-f="document" value="${esc(r.document)}" placeholder="growth/PLAN.md"></div>
        <div style="flex:1"><label>Required sections (comma-separated)</label><input data-i="${i}" data-f="sections" value="${esc(r.sections)}" placeholder="Summary, Details, Open Questions"></div></div>
        <div class="row"><div style="flex:2"><label>A human must accept this work (optional)</label><input data-i="${i}" data-f="human_judges" value="${esc(r.human_judges)}" placeholder="The CEO approves the messaging"></div>
        <label class="chk" style="flex:1"><input type="checkbox" style="width:auto" data-i="${i}" data-f="affects_people" ${r.affects_people ? 'checked' : ''}> affects individuals (always human-decided)</label></div>` : ''}
    </div>`).join('')}
    <div class="card row"><button class="sec" onclick="addRole()">+ Add role</button><span class="spacer"></span>
      <button class="sec" onclick="checkDraft()">Check</button><button class="act" onclick="saveDraft(false)">Save team</button><button class="act" onclick="saveDraft(true)">Save &amp; hire</button></div>
    <div id="b-result">${result || ''}</div>`;
  view.querySelectorAll('[data-f]').forEach((el) => el.addEventListener('change', readField));
  view.querySelectorAll('input[data-f], textarea[data-f]').forEach((el) => el.addEventListener('input', readField));
  ['name', 'team', 'mode', 'risk', 'purpose', 'never'].forEach((f) => document.getElementById('b-' + f).addEventListener('input', (e) => {
    draft[f] = e.target.value;
    if (f === 'name' && !draft.teamTouched) { draft.team = e.target.value.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''); document.getElementById('b-team').value = draft.team; }
    if (f === 'team') draft.teamTouched = true;
  }));
}
function readField(e) {
  const el = e.target; const r = draft.roles[Number(el.dataset.i)]; const f = el.dataset.f;
  if (f === 'works_with' || f === 'reviews') r[f] = [...view.querySelectorAll(`[data-i="${el.dataset.i}"][data-f="${f}"]:checked`)].map((x) => x.value);
  else if (f === 'affects_people') r[f] = el.checked;
  else r[f] = el.value;
  if (f === 'type' || (f === 'title' && e.type === 'change')) renderBuilder();
}
function addRole() { draft.roles.push(blankRole()); renderBuilder(); }
function removeRole(i) { draft.roles.splice(i, 1); renderBuilder(); }
function showResult(t, saved) {
  const derived = t.roles.map((r) => `<li><b>${esc(r.title)}</b> <span class="muted">(${r.category}, ${r.profile})</span><div class="muted">tools: ${r.tools.join(', ')}</div>
    ${r.criteria.map((c) => `<div>✓ ${esc(c.statement)} <span class="muted">— verified by ${c.by}</span></div>`).join('')}${r.reviewer ? `<div class="muted">reviewed by ${r.reviewer}</div>` : ''}</li>`).join('');
  return `<div class="card">${saved ? `<div class="ok"><b>Saved.</b> ${esc(saved)}</div>` : ''}
    ${t.errors.length ? t.errors.map((x) => `<div class="bad">✖ ${esc(x)}</div>`).join('') : '<div class="ok">✔ Passes all architecture rules.</div>'}
    ${[...t.warnings, ...t.notes].map((x) => `<div class="warn">! ${esc(x)}</div>`).join('')}
    ${t.workflow.length ? `<h4>Workflow</h4><div>${t.workflow.map((s) => `${s.key}${s.gate !== 'none' ? ` <span class="pill">${s.gate.replace('_', ' ')}</span>` : ''}`).join(' → ')}</div>` : ''}
    ${derived ? `<h4>What the platform derived</h4><ul>${derived}</ul>` : ''}</div>`;
}
async function checkDraft() {
  try { const t = await api('/api/teams/check', { method: 'POST', body: JSON.stringify({ spec: toSpec(draft) }) }); renderBuilder(showResult(t)); }
  catch (e) { renderBuilder(`<div class="card bad">${esc(e.message)}</div>`); }
}
async function saveDraft(hire) {
  try {
    const r = await api('/api/teams', { method: 'POST', body: JSON.stringify({ spec: toSpec(draft) }) });
    let note = r.saved;
    if (hire) { const h = await api(`/api/catalog/${r.team.key}/hire`, { method: 'POST', body: '{}' }); note += ` — hired ${h.employees.length} employees`; }
    renderBuilder(showResult(r.team, note));
  } catch (e) {
    const t = await api('/api/teams/check', { method: 'POST', body: JSON.stringify({ spec: toSpec(draft) }) }).catch(() => null);
    renderBuilder(`<div class="card bad">${esc(e.message)}</div>` + (t ? showResult(t) : ''));
  }
}

async function signOut() { await api('/auth/logout', { method: 'POST', body: '{}' }).catch(() => null); sessionStorage.removeItem('aic-token'); location.href = '/'; }
api('/api/me').then((m) => {
  const me = document.getElementById('me');
  me.innerHTML = `${esc(m.name)} · ${esc(m.role)}${m.owner ? ' (owner)' : ''} <a href="#" id="signout">sign out</a>`;
  if (!['ceo', 'admin'].includes(m.role)) { delete views.People; renderNav(); }
  document.getElementById('signout').onclick = (e) => { e.preventDefault(); signOut(); };
}).catch(async () => {
  const cfg = await fetch('/api/auth/config').then((r) => r.json()).catch(() => ({}));
  view.innerHTML = `<div class="card"><h3>Sign in</h3>
    ${cfg.google ? '<p><a class="btn" href="/auth/google">Sign in with Google</a></p><p class="muted">Your CEO must have added your email.</p>' : ''}
    <p class="muted">Or open the dashboard link with your access token (…/#token=YOUR_TOKEN).</p></div>`;
});
renderNav(); refresh(); setInterval(() => { if (['Overview', 'Inbox', 'Org', 'Audit'].includes(current)) refresh(); }, 4000);
</script>
